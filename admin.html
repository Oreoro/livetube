<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LiveTube Admin</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M6 4l14 8-14 8z' fill='%239147ff'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body class="admin-body">

<main class="admin-wrap">
  <a class="brand" href="/">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 3.5l15 8.5-15 8.5z" fill="currentColor"/></svg>
    </span>
    <span class="brand-name">LiveTube Admin</span>
  </a>

  <section class="admin-card" id="loginCard">
    <h1 class="admin-title">Sign in</h1>
    <p class="admin-sub">Enter the admin token to manage community channels. If no ADMIN_TOKEN is configured on the server, any token works.</p>
    <form id="loginForm">
      <input id="tokenInput" type="password" placeholder="Admin token" autocomplete="current-password" />
      <button type="submit" class="btn-primary">Unlock panel</button>
    </form>
    <p class="admin-hint">Storage: <span id="storageMode">checking…</span></p>
  </section>

  <section class="admin-card" id="panelCard" hidden>
    <h1 class="admin-title">Community channels</h1>
    <p class="admin-sub">Channels added here appear in the main app under the Community group.</p>

    <form class="admin-form" id="addForm">
      <input id="fHandle" type="text" placeholder="@handle (e.g. NASA)" required />
      <input id="fName" type="text" placeholder="Display name" required />
      <input id="fCat" type="text" placeholder="Category / description" />
      <input id="fGroup" type="text" placeholder="Group (default: Community)" />
      <button type="submit" class="btn-primary">Add channel</button>
    </form>

    <div class="admin-list" id="adminList"></div>
  </section>
</main>

<div class="toast" id="toast" hidden></div>
<script src="admin.js"></script>
</body>
</html>
